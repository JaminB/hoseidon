name: CI

on:
  push:
    branches: [main]
    # A docs-only merge doesn't redeploy (every deploy restarts the Durable Object).
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  # Manual run on main: redeploys, and can re-push the Worker secrets (e.g. after rotating one).
  workflow_dispatch:
    inputs:
      push_secrets:
        description: 'Push every configured GitHub secret to the Worker (rotation)'
        type: boolean
        default: false

# Superseded PR runs are cancelled; runs on main queue instead, so a second merge never kills a
# deploy that is half way between "wrangler deploy" and "wrangler secret bulk".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # PR preview of the Cloudflare bundle: bundles the Worker exactly as a deploy would (no
      # network, no credentials) and fails on size or config errors. Free plan limit: 3 MB gzip.
      - name: Worker dry-run
        run: pnpm --filter @hoseidon/worker exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry"

  # The Node/Docker target (apps/server + better-sqlite3) still exists as a self-host option,
  # so its image keeps being built here (never pushed).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hoseidon/web exec playwright install --with-deps chromium
      - run: pnpm --filter @hoseidon/web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            apps/web/e2e/__screenshots__
            apps/web/e2e/.report
          if-no-files-found: ignore
          include-hidden-files: true

  # Deploys to Cloudflare Workers (Free plan) on every push to main once the checks pass.
  # Skips cleanly (green) until the CLOUDFLARE_API_TOKEN secret exists. See docs/deploy.md.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, docker, e2e]
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a deploy half way; queue the next one behind it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Only a boolean here. The token itself goes to the deploy and secret steps alone, so
      # install scripts and the build never see it.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check Cloudflare credentials
        id: gate
        run: |
          if [ "$HAS_CLOUDFLARE" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (see docs/deploy.md)."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.go == 'true'
      # Builds the web app first (the Worker serves apps/web/dist as static assets) and checks
      # that the generated migrations are current.
      - run: pnpm build
        if: steps.gate.outputs.go == 'true'
      - name: Deploy Worker
        id: deploy
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional repository/environment variables; unset ones keep wrangler.jsonc's value.
          V_LINKTAP_MOCK: ${{ vars.LINKTAP_MOCK }}
          V_ENGINE_ENABLED: ${{ vars.ENGINE_ENABLED }}
          V_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          V_TZ: ${{ vars.TZ }}
        run: |
          set -o pipefail
          args=()
          [ -n "$V_LINKTAP_MOCK" ] && args+=(--var "LINKTAP_MOCK:$V_LINKTAP_MOCK")
          [ -n "$V_ENGINE_ENABLED" ] && args+=(--var "ENGINE_ENABLED:$V_ENGINE_ENABLED")
          [ -n "$V_PUBLIC_URL" ] && args+=(--var "PUBLIC_URL:$V_PUBLIC_URL")
          [ -n "$V_TZ" ] && args+=(--var "TZ:$V_TZ")
          pnpm --filter @hoseidon/worker exec wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # After the deploy so the Worker exists. Only non-empty secrets are sent, so an unset
      # GitHub secret never overwrites (or blanks) one already stored in Cloudflare. Each push
      # makes a new Worker version (and restarts the Durable Object), so on an ordinary merge
      # only secrets Cloudflare doesn't have yet are sent; a manual run with push_secrets sends
      # them all (rotation).
      - name: Push Worker secrets
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.push_secrets }}
          LINKTAP_USERNAME: ${{ secrets.LINKTAP_USERNAME }}
          LINKTAP_API_KEY: ${{ secrets.LINKTAP_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          existing=$(pnpm --filter @hoseidon/worker exec wrangler secret list --format json | sed -n '/^\[/,$p' | jq -c '[.[].name]')
          json=$(jq -n --argjson existing "$existing" --arg all "$PUSH_ALL" '[
            "LINKTAP_USERNAME","LINKTAP_API_KEY","SESSION_SECRET","ADMIN_PASSWORD",
            "WEBHOOK_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","ADMIN_EMAIL"
          ] | map(select($all == "true" or (. as $n | $existing | contains([$n]) | not)))
            | map({key: ., value: (env[.] // "")}) | map(select(.value != "")) | from_entries')
          if [ "$json" = "{}" ]; then
            echo "No new Worker secrets to push; leaving the ones in Cloudflare as they are."
          else
            echo "Pushing: $(echo "$json" | jq -r 'keys | join(", ")')"
            echo "$json" | pnpm --filter @hoseidon/worker exec wrangler secret bulk
          fi
      - name: Smoke check /api/health
        if: steps.gate.outputs.go == 'true'
        env:
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL || steps.deploy.outputs.url }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::warning title=Smoke check skipped::No Worker URL found. Set the CLOUDFLARE_WORKER_URL variable."
            exit 0
          fi
          url="${WORKER_URL%/}/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 20 "$url"; then echo; echo "healthy"; exit 0; fi
            echo "attempt $i failed; retrying in 6s"; sleep 6
          done
          # curl -f fails on 503, which is what a refusing app (weak or missing secrets) answers.
          echo "::error title=Smoke check failed::$url did not return 200 (a 503 means missing or weak secrets; see docs/deploy.md)"
          exit 1
